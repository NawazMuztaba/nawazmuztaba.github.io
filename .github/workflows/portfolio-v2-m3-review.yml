name: Portfolio V2 M3 evidence showcase QA
on:
  push:
    branches:
      - feat/portfolio-v2-m3-evidence-showcase-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history for exact baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser-verify M3 project cards, navigation and protected hero
        run: python qa/portfolio-v2/m3_showcase_qa.py
      - name: Upload review screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-m3-browser-evidence
          path: qa-artifacts/portfolio-v2-m3/
          if-no-files-found: warn
