name: Portfolio V2 visual regression (review only)
on:
  push:
    branches:
      - fix/portfolio-v2-legacy-cleanup-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==12.0.0
          python -m playwright install --with-deps chromium
      - name: Run baseline and candidate browser tests
        run: python qa/portfolio-v2/portfolio_regression.py
      - name: Archive evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-browser-evidence
          path: qa-artifacts/portfolio-v2/
          if-no-files-found: warn
